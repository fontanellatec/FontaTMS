<app-page-layout title="Programação Diária"
  subtitle="Acompanhe a listagem de viagens programadas e gerencie manifestos.">
  <app-filter-section title="Filtros" [filters]="filterConfigs" [(collapsed)]="filtersCollapsed"
    (applyFilters)="onApplyFilters($event)" (clearFilters)="limparFiltros()">
  </app-filter-section>

  <app-kpi-section title="Métricas de Programação" [kpis]="kpiConfigs" [(collapsed)]="kpisCollapsed">
  </app-kpi-section>

  <app-action-button [buttons]="actionButtonConfigs" [collapsed]="false" [showHeader]="false" alignment="right"
    *ngIf="!actionButtonConfigs" (buttonClick)="onActionButtonClick($event)">
  </app-action-button>

  <app-grid-section title="Listagem de Programação" [columns]="gridColumns" [rows]="gridRows" [page]="page"
    [pageSize]="pageSize" [pageSizeOptions]="pageSizeOptions" [horizontalScroll]="true" [verticalScroll]="true"
    [bodyMaxHeight]="560" [fullscreenToggle]="true" [loading]="loading" (pageChange)="page = $event"
    (pageSizeChange)="pageSize = $event" (rowClick)="verRota($event)" (actionClick)="onGridAction($event)">
  </app-grid-section>

  <app-entregas-modal [(open)]="entregasModalOpen" [frota]="selectedFrota"></app-entregas-modal>
</app-page-layout>
