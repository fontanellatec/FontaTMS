<div class="min-h-screen flex items-center justify-center bg-[#1d1e20] p-4 md:p-6 select-none">
  <div
    class="bg-white/5 border border-white/25 rounded-2xl py-5 px-6 md:px-10 w-full max-w-[420px] shadow-none text-center text-white">
    <div class="mb-0">
      <div class="flex flex-col items-center gap-0">
        <img src="/brand/fontaTmsIcon.png" alt="FontaTMS" class="block w-[300px] h-[200px] object-contain" />
        <img src="/brand/FontaTmsText.png" alt="FontaTMS" class="block w-[300px] h-auto object-contain -mt-[100px]" />
      </div>
    </div>

    <p class="m-[-75px]_0_60px_0 text-sm leading-tight text-[#8f96a3]" aria-label="Descrição do sistema">Sistema de
      Gestão de Transporte</p>

    <!-- Login Form -->
    <form class="flex flex-col gap-5 mb-6" (ngSubmit)="onLogin()" #f="ngForm" novalidate>
      <div class="text-left">
        <label for="username" class="block text-sm font-medium text-white mb-2">Nome de Usuário</label>
        <input type="text" id="username"
          class="w-full py-2.5 px-3.5 border border-white/45 rounded-lg text-sm bg-white/10 text-white placeholder-white/75 transition-all focus:outline-none focus:border-white focus:ring-3 focus:ring-white/20"
          [(ngModel)]="username" name="username" #usernameModel="ngModel" required minlength="3"
          placeholder="Digite seu nome de usuário"
          [attr.aria-invalid]="usernameModel.invalid && (usernameModel.dirty || usernameModel.touched)" />
        <div class="mt-1.5 text-[12px] text-error text-left"
          *ngIf="usernameModel.invalid && (usernameModel.dirty || usernameModel.touched)">
          <span *ngIf="usernameModel.errors?.['required']">Informe o usuário.</span>
          <span *ngIf="usernameModel.errors?.['minlength']">Mínimo de 3 caracteres.</span>
        </div>
      </div>

      <div class="text-left">
        <label for="password" class="block text-sm font-medium text-white mb-2">Senha</label>
        <div class="relative">
          <input [type]="showPassword ? 'text' : 'password'" id="password"
            class="w-full py-2.5 px-3.5 pr-[84px] border border-white/45 rounded-lg text-sm bg-white/10 text-white placeholder-white/75 transition-all focus:outline-none focus:border-white focus:ring-3 focus:ring-white/20"
            [(ngModel)]="password" name="password" #passwordModel="ngModel" required minlength="6"
            placeholder="Digite sua senha"
            [attr.aria-invalid]="passwordModel.invalid && (passwordModel.dirty || passwordModel.touched)" />
          <button type="button"
            class="absolute right-2 top-1/2 -translate-y-1/2 bg-transparent border border-transparent text-white/90 py-1.5 px-2.5 rounded-lg cursor-pointer hover:bg-white/10 hover:text-white"
            (click)="togglePasswordVisibility()" [attr.aria-pressed]="showPassword"
            [attr.aria-label]="showPassword ? 'Ocultar senha' : 'Mostrar senha'">
            {{ showPassword ? 'Ocultar' : 'Mostrar' }}
          </button>
        </div>
        <div class="mt-1.5 text-[12px] text-error text-left"
          *ngIf="passwordModel.invalid && (passwordModel.dirty || passwordModel.touched)">
          <span *ngIf="passwordModel.errors?.['required']">Informe a senha.</span>
          <span *ngIf="passwordModel.errors?.['minlength']">Mínimo de 6 caracteres.</span>
        </div>
      </div>


      <div class="text-xs text-red-400 bg-red-950/40 border border-red-500/50 rounded-lg p-2.5 text-center mt-2"
        *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <app-btn variant="primary" type="submit" class="w-full mt-2" [disabled]="!!f.invalid || loading">
        {{ loading ? 'Entrando...' : 'Entrar' }}
      </app-btn>

      <div class="flex gap-2 justify-center items-center mt-2">
        <button type="button"
          class="bg-transparent border-none text-white text-sm cursor-pointer py-1.5 px-1 opacity-90 hover:opacity-100 hover:underline"
          (click)="onForgotPassword()">Esqueci a minha senha</button>
      </div>
    </form>

    <div class="mt-8 pt-6 border-t border-white/25 text-[12px] text-white/85">
      <p>&copy; 2026 FontaTMS</p>
    </div>
  </div>
</div>
