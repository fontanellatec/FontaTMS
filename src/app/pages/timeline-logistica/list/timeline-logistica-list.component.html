<app-page-layout title="Timeline de Veículos" subtitle="Acompanhamento cronológico do status e eventos da frota.">
  <div class="overflow-hidden">
    <iframe class="w-full min-h-0 border-none block" src="/assets/mockups/timelineLogistica.html?embed=1"
      [style.height.px]="frameHeight" title="Timeline Logistica" loading="lazy"></iframe>
  </div>

  <!-- Modal Fleet -->
  <app-timeline-fleet-modal *ngIf="fleetModalData" [data]="fleetModalData"
    (close)="closeModal()"></app-timeline-fleet-modal>

  <!-- Modal Event -->
  <app-timeline-event-modal *ngIf="eventModalData" [data]="eventModalData" [markers]="mapMarkers"
    [polylines]="mapPolylines" [mapSummary]="eventMapSummary" (close)="closeModal()"></app-timeline-event-modal>
</app-page-layout>
