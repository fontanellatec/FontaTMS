<span class="inline-flex items-center gap-1.5 rounded font-semibold uppercase tracking-wider leading-none transition-all duration-200"
      [ngClass]="{
        'py-0.5 px-1.5 text-[10px]': size() === 'sm',
        'py-1 px-2 text-[11px]': size() === 'md',
        'bg-success/10 text-success': status() === 'success',
        'bg-warning/10 text-warning': status() === 'warning',
        'bg-error/10 text-error': status() === 'error',
        'bg-info/10 text-info': status() === 'info',
        'bg-text-secondary/20 text-text-secondary': status() === 'neutral'
      }">
  <span *ngIf="dot()" class="w-1.5 h-1.5 rounded-full inline-block"
        [ngClass]="{
          'bg-success': status() === 'success',
          'bg-warning': status() === 'warning',
          'bg-error': status() === 'error',
          'bg-info': status() === 'info',
          'bg-text-secondary': status() === 'neutral'
        }"></span>
  {{ label() }}
</span>
