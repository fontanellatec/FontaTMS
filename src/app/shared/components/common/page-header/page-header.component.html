<div class="flex items-center justify-between py-1.5 pb-2.5 mb-3.5 gap-3 flex-wrap">
  <div class="flex items-center gap-3">
    <a *ngIf="showBackButton() && backLink()" 
       [routerLink]="backLink()" 
       class="inline-flex items-center justify-center w-7 h-7 rounded-full border border-border bg-surface-secondary text-text cursor-pointer transition-all duration-200 no-underline hover:bg-border hover:text-brand-primary hover:-translate-x-0.5" 
       aria-label="Voltar para a página anterior">
      <svg viewBox="0 0 24 24" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
    </a>
    <div class="flex flex-col gap-0.5">
      <h1 class="m-0 text-[18px] font-bold text-text tracking-[-0.3px] leading-tight">{{ title() }}</h1>
      <p *ngIf="subtitle()" class="m-0 text-[11px] text-text-secondary leading-tight">{{ subtitle() }}</p>
    </div>
  </div>
  <div class="flex items-center gap-2">
    <ng-content></ng-content>
  </div>
</div>
