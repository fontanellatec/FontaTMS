<div class="bg-surface border border-border rounded-lg p-3">
  <div class="flex justify-between items-center mb-1.5">
    <div class="titles">
      <div class="font-semibold text-text">{{ title }}</div>
      <div class="text-xs text-text-secondary" *ngIf="subtitle">{{ subtitle }}</div>
    </div>
    <div class="flex gap-3 items-center text-xs text-text-secondary">
      <span class="legend-item"><span class="w-2.5 h-2.5 rounded-full inline-block mr-1.5" [style.background]="colorFuel"></span> Combustível</span>
      <span class="legend-item"><span class="w-2.5 h-2.5 rounded-full inline-block mr-1.5" [style.background]="colorToll"></span> Pedágio</span>
      <span class="legend-item"><span class="w-4 h-0.5 inline-block mr-1.5" [style.background]="colorOverlay"></span> % vazio</span>
    </div>
  </div>

  <svg [attr.width]="width" [attr.height]="height">
    <g>
      <line [attr.x1]="padding.left" [attr.y1]="padding.top + innerH" [attr.x2]="padding.left + innerW" [attr.y2]="padding.top + innerH" stroke="#e5e7eb" />
      <line [attr.x1]="padding.left" [attr.y1]="padding.top" [attr.x2]="padding.left" [attr.y2]="padding.top + innerH" stroke="#e5e7eb" />
    </g>

    <g *ngFor="let m of labels; let i = index">
      <rect [attr.x]="fuelRect(i).x" [attr.y]="fuelRect(i).y" [attr.width]="fuelRect(i).w" [attr.height]="fuelRect(i).h" [attr.fill]="colorFuel" rx="4"></rect>
      <rect [attr.x]="tollRect(i).x" [attr.y]="tollRect(i).y" [attr.width]="tollRect(i).w" [attr.height]="tollRect(i).h" [attr.fill]="colorToll" rx="4"></rect>
      <text [attr.x]="x(i)" [attr.y]="padding.top + innerH + 16" text-anchor="middle" class="text-[11px] fill-text-secondary">{{ m }}</text>
    </g>

    <polyline *ngIf="overlayPerc?.length" [attr.points]="overlayPoints()" [attr.stroke]="colorOverlay" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </svg>
</div>
