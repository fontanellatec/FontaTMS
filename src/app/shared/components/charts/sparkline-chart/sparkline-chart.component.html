<div class="bg-surface border border-border rounded-lg shadow-sm overflow-hidden">
  <div class="flex flex-col gap-0.5 p-2 bg-surface-secondary border-b border-border">
    <div class="text-[13px] font-bold text-text">{{ title }}</div>
    <div class="text-[11px] text-text-secondary" *ngIf="subtitle">{{ subtitle }}</div>
  </div>
  <div class="h-[100px] py-1.5 px-2">
    <svg class="w-full h-full" [attr.viewBox]="viewBox" preserveAspectRatio="none">
      <defs>
        <linearGradient id="sparkGradient" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" [attr.style]="'stop-color:'+color+';stop-opacity:0.28'"/>
          <stop offset="100%" [attr.style]="'stop-color:'+color+';stop-opacity:0'"/>
        </linearGradient>
      </defs>
      <polyline [attr.points]="points" [attr.stroke]="color" stroke-width="2.5" fill="none" />
      <polygon *ngIf="variant==='area'" [attr.points]="areaPoints" fill="url(#sparkGradient)" />
    </svg>
  </div>
</div>
