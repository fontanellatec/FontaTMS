<div class="autocomplete-container">
  <div class="input-wrapper">
    <input
      #inputEl
      type="text"
      [value]="searchTerm"
      [placeholder]="placeholder"
      (input)="onInput($event)"
      (focus)="onFocus()"
      (keydown)="onKeyDown($event)"
      autocomplete="off"
      class="autocomplete-input"
    />
    
    <!-- Spinner de Loading ou Lupa -->
    <div class="input-icon-right">
      <svg *ngIf="isLoading" class="spinner" viewBox="0 0 24 24" fill="none">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
      <svg *ngIf="!isLoading && !value" class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
    </div>

    <!-- Botão Limpar Seleção (X) -->
    <button *ngIf="value" type="button" class="clear-btn" (click)="clearSelection($event)" title="Limpar seleção">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <!-- Dropdown de Opções -->
  <div #dropdownEl class="autocomplete-dropdown" *ngIf="isOpen && (filteredOptions.length > 0 || !isLoading)">
    <div class="options-list">
      <div 
        *ngFor="let opt of filteredOptions; let i = index" 
        class="autocomplete-option" 
        [class.active]="i === activeIndex" 
        (mousedown)="selectOption(opt)"
        [attr.aria-selected]="i === activeIndex"
      >
        <div class="option-content">
          <span class="option-label">{{ opt.label }}</span>
          <span class="option-subtitle" *ngIf="opt.subtitle">{{ opt.subtitle }}</span>
        </div>
      </div>
      
      <!-- Mensagem quando não houver resultados -->
      <div class="autocomplete-no-results" *ngIf="filteredOptions.length === 0 && !isLoading">
        Nenhum resultado encontrado
      </div>
    </div>
  </div>
</div>
