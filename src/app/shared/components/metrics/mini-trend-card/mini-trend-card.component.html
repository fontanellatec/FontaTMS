<div class="bg-surface border rounded-lg p-2.5 shadow-sm transition-all duration-200"
     [ngClass]="{
       'border-border': colorClass === 'neutral',
       'border-success': colorClass === 'improve',
       'border-error': colorClass === 'worse'
     }">
  <div class="flex items-center gap-1.5 mb-1.5">
    <span class="text-base shrink-0 inline-flex items-center justify-center [&>svg]:w-4 [&>svg]:h-4 [&>svg]:text-text-secondary" [innerHTML]="getIconSvg(icon)"></span>
    <span class="font-semibold text-[13px] text-text">{{ title }}</span>
  </div>
  <div class="flex items-baseline justify-between text-xs text-text-secondary">
    <span class="text-base text-text font-bold">{{ formatValue(value) }}</span>
    <span class="font-bold transition-colors duration-200"
          [ngClass]="{
            'text-text-secondary': colorClass === 'neutral',
            'text-success': colorClass === 'improve',
            'text-error': colorClass === 'worse'
          }">
      {{ arrow }} {{ formatValue(abs(delta)) }}
    </span>
  </div>
  <div class="mt-1.5">
    <app-sparkline-chart
      [labels]="labels"
      [series]="series"
      [color]="color"
      [height]="70"
      [yMin]="variant === 'area' ? 0 : undefined"
      [yMax]="undefined"
      [title]="''"
      [subtitle]="''"
      [variant]="variant">
    </app-sparkline-chart>
  </div>
</div>
