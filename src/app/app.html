@if (!isLoginRoute()) {
<!-- Header global unificado -->
<header class="flex items-center justify-between py-2 px-4 bg-brand-primary text-white h-[56px] shadow-sm select-none">
  <div class="flex items-center gap-2.5">
    <img class="logo" [src]="brandLogo()" (error)="useFallbackLogo()" alt="Logo" />
    <span class="w-[1px] h-[20px] bg-white/20 mx-2"></span>
    <h1 class="text-[13px] font-semibold text-white m-0 flex items-center gap-1.5">
      <span class="opacity-60 font-normal hover:text-white transition-colors duration-150">Páginas</span>
      <span class="opacity-40">/</span>
      <span class="tracking-wide">{{ getPageTitle() }}</span>
    </h1>
  </div>
  <div class="flex items-center gap-2">
    <button class="flex items-center justify-center bg-transparent border-0 text-white/80 hover:text-white w-8 h-8 rounded-lg hover:bg-white/10 active:scale-95 transition-all duration-200 cursor-pointer" title="Pesquisar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-4 h-4">
        <circle cx="11" cy="11" r="8"/>
        <path d="m21 21-4.35-4.35"/>
      </svg>
    </button>
    <button class="flex items-center justify-center bg-transparent border-0 text-white/80 hover:text-white w-8 h-8 rounded-lg hover:bg-white/10 active:scale-95 transition-all duration-200 cursor-pointer" title="Notificações">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-4 h-4">
        <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
        <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
      </svg>
    </button>
    <label class="flex items-center justify-center bg-transparent border-0 text-white/80 hover:text-white w-8 h-8 rounded-lg hover:bg-white/10 active:scale-95 transition-all duration-200 cursor-pointer relative" title="Tema">
      <input type="checkbox" class="hidden" [checked]="isDark()" (change)="toggleTheme()" />
      @if (!isDark()) {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-4 h-4">
          <circle cx="12" cy="12" r="5"/>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-4 h-4">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      }
    </label>
    <div class="relative flex items-center gap-2 py-1 px-1.5 pr-2.5 rounded-full border border-white/20 bg-white/5 text-white select-none hover:bg-white/10 hover:border-white/30 transition-all duration-200 cursor-pointer focus:outline-none" (click)="toggleUserMenu()" tabindex="0">
      <img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=32&h=32&fit=crop&crop=face" 
           alt="User" class="w-7 h-7 rounded-full object-cover">
      <span class="text-sm font-medium text-white">André</span>
      <svg class="w-4 h-4 text-white opacity-80 transition-transform duration-200" [class.rotate-180]="userMenuOpen()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      @if (userMenuOpen()) {
        <div class="absolute right-0 top-[calc(100%+8px)] min-w-[220px] bg-surface border border-border shadow-lg rounded-xl p-2 z-50 transition-all duration-150 animate-in fade-in slide-in-from-top-2" (click)="$event.stopPropagation()">
          <a class="flex items-center gap-2.5 py-2 px-3 rounded-lg text-text hover:bg-surface-secondary text-sm font-medium transition-colors duration-150 no-underline" routerLink="/config-menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-4 h-4 text-text-secondary">
              <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            Configuração de Menu
          </a>
          <div class="h-[1px] bg-border/60 my-1 mx-1"></div>
          <a class="flex items-center gap-2.5 py-2 px-3 rounded-lg text-error hover:bg-error-bg text-sm font-medium transition-colors duration-150 no-underline" (click)="logout()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-4 h-4 text-error">
              <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
            </svg>
            Sair
          </a>
        </div>
      }
    </div>
  </div>
</header>

<div class="shell" [class.sidebar-collapsed]="sidebarCollapsed()">
  <!-- Sidebar Navigation -->
  <aside class="sidebar relative border-r border-border shadow-sm">
    <!-- Botão Flutuante de Toggle (Recolher/Expandir) -->
    <button class="absolute top-6 -right-3.5 w-7 h-7 rounded-full bg-surface border border-border text-text shadow-sm hover:shadow-md hover:bg-surface-secondary flex items-center justify-center cursor-pointer transition-all duration-200 active:scale-95 z-40 focus:outline-none" (click)="toggleSidebar()" aria-label="Alternar menu">
      @if (!sidebarCollapsed()) {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="w-3.5 h-3.5 text-text-secondary">
          <polyline points="15,18 9,12 15,6"/>
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="w-3.5 h-3.5 text-text-secondary">
          <polyline points="9,18 15,12 9,6"/>
        </svg>
      }
    </button>
    
    <nav class="sidebar-nav pt-4">
      <!-- Torre de Controle (primeiro item) -->
      <a class="nav-item" routerLink="/torre-controle" routerLinkActive="active" *ngIf="isMenuEnabled('torre-controle')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 3v6"/>
          <circle cx="12" cy="12" r="2"/>
          <path d="M5 20l7-16 7 16"/>
        </svg>
        <span>Torre de Controle</span>
      </a>

      <!-- Rastreamento -->
      <a class="nav-item" routerLink="/rastreamento" routerLinkActive="active" *ngIf="isMenuEnabled('rastreamento')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7z"/>
          <circle cx="12" cy="9" r="2"/>
        </svg>
        <span>Rastreamento</span>
      </a>

      <!-- Programação -->
      <a class="nav-item" routerLink="/programacao" routerLinkActive="active" *ngIf="isMenuEnabled('programacao')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="16" rx="2"/>
          <path d="M3 8h18"/>
          <path d="M7 12h3M11 12h3M15 12h3"/>
        </svg>
        <span>Programação</span>
      </a>

      <!-- Controle de Pré-Carga -->
      <a class="nav-item" routerLink="/controle-intencao-viagem" routerLinkActive="active" *ngIf="isMenuEnabled('controle-intencao-viagem')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
          <path d="M15 15h6M15 18h6M15 21h6"/>
        </svg>
        <span>Controle de Pré-Carga</span>
      </a>

      <!-- Timeline Logística -->
      <a class="nav-item" routerLink="/timeline-logistica" routerLinkActive="active" *ngIf="isMenuEnabled('timeline-logistica')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 6h4v4H4z"/>
          <path d="M10 8h10"/>
          <path d="M16 6h4v4h-4z"/>
          <path d="M4 14h4v4H4z"/>
          <path d="M10 16h10"/>
          <path d="M9 8h6"/>
          <path d="M9 16h6"/>
        </svg>
        <span>Timeline Logística</span>
      </a>

      <!-- Link de Configuração de Menu movido para o dropdown do usuário -->
    </nav>
    
    <div class="sidebar-footer">
      <div class="brand-footer">
        <div class="footer-logo"></div>
        <div class="footer-text">
          <div class="footer-brand">FontaTec</div>
          <div class="footer-subtitle">ERP</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Content Area -->
  <div class="main-content">
    <!-- Page Content -->
    <main class="content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
} @else {
  <router-outlet></router-outlet>
}
